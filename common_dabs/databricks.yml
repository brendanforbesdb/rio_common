# Databricks Asset Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "common_dabs"

include:
  - resources/*.yml

sync:
  paths:
    - common_dabs/libs/common


targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
      # We always use /Users/brendan.forbes@databricks.com for all resources to make sure we only have a single copy.
      root_path: /Users/brendan.forbes@databricks.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # This runs as brendan.forbes@databricks.com in production. We could also use a service principal here,
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: brendan.forbes@databricks.com
